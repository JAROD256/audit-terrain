<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <title>Audit Terrain</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ═══════ ÉCRAN D'ACCUEIL ═══════ -->
  <div id="screen-home" class="screen active">
    <header class="app-header">
      <h1>Audit Terrain</h1>
      <span id="clock" class="clock"></span>
    </header>

    <div class="dashboard">
      <button id="btn-audit" class="dash-btn dash-btn--audit" onclick="App.startAudit()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        <span>AUDIT</span>
        <small>Photo + Annotation</small>
      </button>
      <button id="btn-note" class="dash-btn dash-btn--note" onclick="App.startNote()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>NOTE</span>
        <small>Texte rapide</small>
      </button>
    </div>

    <div class="pending-banner" id="pending-banner" onclick="App.showList()" style="display:none">
      <span id="pending-count">0</span> élément(s) en attente
    </div>

    <nav class="bottom-nav">
      <button class="nav-btn active" onclick="App.goHome()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Accueil
      </button>
      <button class="nav-btn" onclick="App.showList()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
        Liste
        <span class="badge" id="badge-count" style="display:none">0</span>
      </button>
      <button class="nav-btn" onclick="App.showReport()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        Rapport
      </button>
    </nav>
  </div>

  <!-- ═══════ CAPTURE PHOTO (AUDIT) ═══════ -->
  <div id="screen-capture" class="screen">
    <header class="app-header">
      <button class="back-btn" onclick="App.goHome()">&#8592;</button>
      <h1>Prendre une photo</h1>
    </header>
    <div class="capture-zone">
      <video id="camera-feed" autoplay playsinline muted></video>
      <canvas id="camera-canvas" style="display:none"></canvas>
      <button id="btn-capture" class="capture-btn" onclick="App.capturePhoto()">
        <div class="capture-ring"></div>
      </button>
    </div>
  </div>

  <!-- ═══════ ANNOTATION CANVAS ═══════ -->
  <div id="screen-annotate" class="screen">
    <header class="app-header">
      <button class="back-btn" onclick="App.backToCapture()">&#8592;</button>
      <h1>Annoter</h1>
      <button class="header-action" onclick="App.undoAnnotation()">↩ Annuler</button>
    </header>
    <div class="annotate-zone">
      <canvas id="annotate-canvas"></canvas>
    </div>
    <div class="annotate-tools">
      <button class="tool-btn tool-active" data-tool="draw" onclick="App.setTool('draw')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg>
        Dessin
      </button>
      <button class="tool-btn" data-tool="arrow" onclick="App.setTool('arrow')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
        Flèche
      </button>
      <button class="tool-btn" data-tool="text" onclick="App.setTool('text')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4v3h5.5v12h3V7H19V4z"/></svg>
        Texte
      </button>
      <input type="color" id="annotate-color" value="#ff0000" class="color-pick">
    </div>
    <button class="action-btn action-btn--next" onclick="App.finishAnnotation()">Suivant ➜</button>
  </div>

  <!-- ═══════ FORMULAIRE AUDIT ═══════ -->
  <div id="screen-audit-form" class="screen">
    <header class="app-header">
      <button class="back-btn" onclick="App.backToAnnotate()">&#8592;</button>
      <h1>Détails de l'audit</h1>
    </header>
    <div class="form-body">
      <div class="preview-thumb" id="preview-thumb"></div>
      <label class="field-label">Commentaire</label>
      <textarea id="audit-comment" class="field-input" rows="3" placeholder="Décrivez le problème..."></textarea>
      <label class="field-label">Catégorie</label>
      <div class="category-grid">
        <button class="cat-btn cat-btn--securite" data-cat="Sécurité" onclick="App.pickCategory(this)">🛡️ Sécurité</button>
        <button class="cat-btn cat-btn--proprete" data-cat="Propreté" onclick="App.pickCategory(this)">🧹 Propreté</button>
        <button class="cat-btn cat-btn--maintenance" data-cat="Maintenance" onclick="App.pickCategory(this)">🔧 Maintenance</button>
      </div>
      <button class="action-btn action-btn--save" onclick="App.saveAudit()">Enregistrer l'audit</button>
    </div>
  </div>

  <!-- ═══════ FORMULAIRE NOTE ═══════ -->
  <div id="screen-note" class="screen">
    <header class="app-header">
      <button class="back-btn" onclick="App.goHome()">&#8592;</button>
      <h1>Nouvelle note</h1>
    </header>
    <div class="form-body">
      <label class="field-label">Note rapide</label>
      <textarea id="note-text" class="field-input field-input--big" rows="6" placeholder="Écrivez votre remarque..."></textarea>
      <button class="action-btn action-btn--save" onclick="App.saveNote()">Enregistrer la note</button>
    </div>
  </div>

  <!-- ═══════ LISTE EN ATTENTE / HISTORIQUE ═══════ -->
  <div id="screen-list" class="screen">
    <header class="app-header">
      <button class="back-btn" onclick="App.goHome()">&#8592;</button>
      <h1>Éléments</h1>
    </header>
    <div class="tabs">
      <button class="tab active" id="tab-pending" onclick="App.switchTab('pending')">En attente</button>
      <button class="tab" id="tab-validated" onclick="App.switchTab('validated')">Validés</button>
    </div>
    <div class="list-container" id="list-container"></div>
  </div>

  <!-- ═══════ RAPPORT ═══════ -->
  <div id="screen-report" class="screen">
    <header class="app-header">
      <button class="back-btn" onclick="App.goHome()">&#8592;</button>
      <h1>Rapport</h1>
    </header>
    <div class="report-body" id="report-body">
      <p class="empty-msg">Aucun élément validé pour le moment.</p>
    </div>
    <div class="report-actions">
      <button class="action-btn action-btn--export" onclick="App.exportJSON()">📄 Export JSON</button>
      <button class="action-btn action-btn--print" onclick="App.printReport()">🖨️ Imprimer / PDF</button>
    </div>
  </div>

  <!-- ═══════ ALERTE MODALE ═══════ -->
  <div id="alarm-modal" class="modal" style="display:none">
    <div class="modal-box">
      <div class="modal-icon">⚠️</div>
      <h2>Rappel Audit – 14h30</h2>
      <p id="alarm-msg"></p>
      <button class="action-btn" onclick="App.dismissAlarm()">Compris</button>
    </div>
  </div>

  <!-- ═══════ TOAST ═══════ -->
  <div id="toast" class="toast"></div>

  <audio id="alarm-sound" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdH2LkZeYl5KMhH13cW9ydnuBhoyRlZiXk46Ifnh0cHF0eH6EipCUl5eUkIuFf3lzcHF0eX+FjJGVl5aTj4qEfnhycHJ1eoCGjJKWmJaTj4qEfXdxcHN3fYOJj5OXl5WRjIeAenhzdHd8goiOk5eYlpKNh4F7dXJzdnuBh42Sl5iXk4+JhH54c3FzdnuBh42TmJmXk4+JhH13cnBydXuBiI6Ul5iWko2Hgnx2c3J1e4GHjpSYmZeTjoiFf3lzcXN3fYSKkJWYl5WQi4WAfHZ0dXl/hYuRlpiXlJCLhYB7dnR1eX+FjJKXmZiUkIuFf3p1c3R3fYSLkZaYl5SQi4V/" type="audio/wav">
  </audio>

  <script src="app.js"></script>
</body>
</html>
